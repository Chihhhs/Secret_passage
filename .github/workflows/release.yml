name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Client EXE
        run: |
          pyinstaller --onefile --noconsole --name client src/module/client.py

      - name: Build hidden DLL (MSVC)
        run: |
          cd src/ptr
          cl /LD /EHsc /O2 /I include src/hidden.cpp /Fe:hidden.dll /link ntdll.lib
        shell: cmd
        continue-on-error: true

      - name: Prepare release files
        run: |
          if (-not (Test-Path release)) { New-Item -ItemType Directory -Path release }
          Copy-Item dist\client.exe release\
          if (Test-Path src\ptr\hidden.dll) { Copy-Item src\ptr\hidden.dll release\ }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/client.exe
            release/hidden.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
