name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Client EXE
        run: |
          pyinstaller --onefile --noconsole --name client src/module/client.py

      - name: Clone and build MinHook
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/TsudaKageyu/minhook.git C:\minhook
          cd C:\minhook
          cl /LD /EHsc /O2 /MT src\hook.c src\buffer.c src\trampoline.c src\hde\hde32.c src\hde\hde64.c /Fe:MinHook.x64.dll /link /DLL /IMPLIB:MinHook.x64.lib
        continue-on-error: true

      - name: Build hidden DLL (MSVC)
        shell: cmd
        run: |
          cd src\ptr
          cl /LD /EHsc /O2 /I include /I C:\minhook\include hidden.cpp /Fe:hidden.dll /link C:\minhook\MinHook.x64.lib ntdll.lib
        continue-on-error: true

      - name: Prepare release files
        run: |
          if (-not (Test-Path release)) { New-Item -ItemType Directory -Path release }
          Copy-Item dist\client.exe release\
          if (Test-Path src\ptr\hidden.dll) { Copy-Item src\ptr\hidden.dll release\ }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/client.exe
            release/hidden.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
